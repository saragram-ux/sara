<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>sara lou — Sara Gramstad · UI / Product / Frontend</title>
    <meta
      name="description"
      content="sara lou — Sara Gramstad. UI designer, product designer and frontend developer. Co-founder of Handsdown Studio, designing interfaces since 2018. Freelance and contract work, remote across Europe."
    />
    <meta name="theme-color" content="#f3f0e8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sara lou" />
    <meta property="og:title" content="sara lou — UI / Product / Frontend" />
    <meta property="og:description" content="Hi, I’m Sara. I design websites and products." />
    <meta property="og:image" content="%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Who this is, for search engines: the brand is sara lou, the person is Sara Gramstad -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sara Gramstad",
        "alternateName": "sara lou",
        "jobTitle": "UI Designer, Product Designer & Frontend Developer",
        "description": "UI designer, product designer and frontend developer. Co-founder of Handsdown Studio.",
        "email": "mailto:sara.gramstad@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Östersund", "addressCountry": "SE" },
        "worksFor": { "@type": "Organization", "name": "Handsdown Studio" },
        "sameAs": ["https://www.linkedin.com/in/sara-gramstad"],
        "knowsAbout": ["UI design", "Product design", "UX design", "Design systems", "Webflow", "Frontend development"]
      }
    </script>

    <!-- Intro: decide before first paint whether it runs at all -->
    <script>
      try {
        if (sessionStorage.getItem('sg:intro') || matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.add('no-intro')
      } catch (e) {
        document.documentElement.classList.add('no-intro')
      }
    </script>
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(1.25rem, 0.6rem + 2.2vw, 2.5rem);
        background: #161513;
        color: #faf8f3;
        font: 450 11px/1.3 ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        will-change: transform;
      }
      .no-intro #intro {
        display: none;
      }
      /* Fail-safe: if the app's JavaScript never arrives, don't trap anyone behind the intro. */
      #intro {
        animation: intro-failsafe 0.4s ease 4s forwards;
      }
      @keyframes intro-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      #intro .row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }
      #intro .muted {
        opacity: 0.55;
      }
      #intro .brand {
        text-transform: none;
        letter-spacing: 0.02em;
        font-size: 13px;
      }
      #intro .dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-left: 4px;
        background: #9dc21b;
      }
      #intro-bar {
        height: 1px;
        background: #9dc21b;
        transform: scaleX(0);
        transform-origin: left;
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="row">
        <span class="brand">sara lou<span class="dot"></span></span>
        <span class="muted">UI / Product / Frontend</span>
      </div>
      <div>
        <div id="intro-bar"></div>
        <div class="row">
          <span>Sara Gramstad</span>
          <span><span id="intro-count">000</span> <span class="muted">/ 100</span></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Licensed fonts live in the private saragram-ux/fonts repo, never in this one.
      # FONTS_TOKEN: a fine-grained token with read access to that repo's contents.
      # Without it the build still works and the site uses its free fallback fonts.
      - name: Fetch licensed fonts
        env:
          FONTS_TOKEN: ${{ secrets.FONTS_TOKEN }}
        run: |
          if [ -z "$FONTS_TOKEN" ]; then echo "No FONTS_TOKEN: building with the fallback fonts"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${FONTS_TOKEN}@github.com/saragram-ux/fonts.git" "$RUNNER_TEMP/fonts"
          scripts/fonts.sh "$RUNNER_TEMP/fonts"
      # Ask Pages where the site lives: "/sara" on saragram-ux.github.io, "" on a custom domain (saralou.co).
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Full address for link previews (og:image needs an absolute URL)
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      # GitHub Pages has no SPA rewrites: serve the app for unknown paths so deep links work
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
